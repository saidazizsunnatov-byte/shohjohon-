
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopUz - Onlayn magazin</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <header>
    <h1>🛒 ShopUz</h1>
    <input type="text" id="qidiruv" placeholder="Mahsulot qidirish...">
    <button id="savatBtn">🛍️ Savat: <span id="savatSoni">0</span></button>
  </header>

  <nav>
    <a href="#">Bosh sahifa</a>
    <a href="#mahsulotlar">Mahsulotlar</a>
    <a href="#aloqa">Aloqa</a>
  </nav>

  <section class="banner">
    <h2>Eng yaxshi mahsulotlar!</h2>
    <p>Qulay narxlar va sifatli mahsulotlar</p>
    <a href="#mahsulotlar" class="btn">Xarid qilish</a>
  </section>

  <main id="mahsulotlar">
    <h2>Mashhur mahsulotlar</h2>

    <div class="mahsulotlar">

      <div class="karta" data-nom="Telefon">
        <div class="rasm">📱</div>
        <h3>Telefon</h3>
        <p>3 000 000 so'm</p>
        <button class="sevimli">♡</button>
        <button class="savatga">Savatga qo'shish</button>
      </div>

      <div class="karta" data-nom="Noutbuk">
        <div class="rasm">💻</div>
        <h3>Noutbuk</h3>
        <p>7 000 000 so'm</p>
        <button class="sevimli">♡</button>
        <button class="savatga">Savatga qo'shish</button>
      </div>

      <div class="karta" data-nom="Quloqchin">
        <div class="rasm">🎧</div>
        <h3>Quloqchin</h3>
        <p>250 000 so'm</p>
        <button class="sevimli">♡</button>
        <button class="savatga">Savatga qo'shish</button>
      </div>

      <div class="karta" data-nom="Soat">
        <div class="rasm">⌚</div>
        <h3>Smart soat</h3>
        <p>450 000 so'm</p>
        <button class="sevimli">♡</button>
        <button class="savatga">Savatga qo'shish</button>
      </div>

    </div>
  </main>

  <footer id="aloqa">
    <p>© 2026 ShopUz | Barcha huquqlar himoyalangan</p>
  </footer>

  <script src="./index.js"></script>
</body>
</html>
